name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cineleaf-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Automation/mcp/package-lock.json
      - name: Test MCP automation contract
        run: |
          npm ci --prefix Automation/mcp
          npm audit --prefix Automation/mcp --audit-level=moderate
          npm test --prefix Automation/mcp
      - name: Verify private brief is not tracked
        run: |
          if git ls-files | grep -Eiq '(^|/)instructions[.,]*\.md$'; then
            echo 'A private instructions file is tracked.' >&2
            exit 1
          fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Test editing core
        run: swift test --package-path Packages/CineleafCore
      - name: Build and test app
        run: |
          set -o pipefail
          xcodebuild \
            -project Cineleaf.xcodeproj \
            -scheme Cineleaf \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test | tee xcodebuild.log
      - name: Verify universal release packaging
        run: |
          ./scripts/build_release.sh
          (cd dist && shasum -a 256 --check SHA256SUMS.txt)
          hdiutil verify dist/Cineleaf-0.2.0-macOS.dmg
          ARCHITECTURES="$(lipo -archs dist/Cineleaf.app/Contents/MacOS/Cineleaf)"
          [[ "$ARCHITECTURES" == *arm64* && "$ARCHITECTURES" == *x86_64* ]]
      - name: Smoke-test optional MCP setup
        run: |
          mkdir -p "$RUNNER_TEMP/cineleaf-ai-root"
          CINELEAF_MCP_INSTALL_ROOT="$RUNNER_TEMP/cineleaf-mcp" \
          CINELEAF_AUTOMATION_CLI="$PWD/dist/Cineleaf.app/Contents/MacOS/CineleafCLI" \
            ./scripts/setup_cineleaf_mcp.sh "$RUNNER_TEMP/cineleaf-ai-root"
          test -f "$RUNNER_TEMP/cineleaf-mcp/src/index.js"
          grep -q '"cineleaf"' "$RUNNER_TEMP/cineleaf-mcp/cineleaf-mcp-config.json"
      - name: Upload logs and generated project on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-ci-diagnostics
          path: |
            xcodebuild.log
            Cineleaf.xcodeproj
          if-no-files-found: ignore
